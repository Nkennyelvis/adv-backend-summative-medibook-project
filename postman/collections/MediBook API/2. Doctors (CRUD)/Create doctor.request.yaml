$kind: http-request
url: "{{baseUrl}}/api/doctors"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "full_name": "Dr. Alice Ingabire",
      "email": "ingabire@medibook.com",
      "specialty": "Neurology",
      "consultation_fee": 180,
      "room": "R-15"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('newDoctorId', pm.response.json().doctor_id);
    language: text/javascript
order: 4000
