$kind: http-request
url: "{{baseUrl}}/api/waitlist"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "patient_id": {{waitPatientId}},
      "doctor_id": 1,
      "date": "{{capDay}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('status is 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 4000
