$kind: http-request
url: "{{baseUrl}}/api/appointments"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "patient_id": 1,
      "doctor_id": 2,
      "datetime": "{{day3}} 10:00"
    }
scripts:
  - type: afterResponse
    code: pm.test('status is 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 4000
