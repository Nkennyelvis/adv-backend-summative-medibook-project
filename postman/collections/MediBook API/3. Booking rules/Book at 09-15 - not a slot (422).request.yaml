$kind: http-request
name: Book at 09:15 - not a slot (422)
url: "{{baseUrl}}/api/appointments"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "patient_id": 1,
      "doctor_id": 2,
      "datetime": "{{day3}} 09:15"
    }
scripts:
  - type: afterResponse
    code: pm.test('status is 422', () => pm.response.to.have.status(422));
    language: text/javascript
order: 6000
