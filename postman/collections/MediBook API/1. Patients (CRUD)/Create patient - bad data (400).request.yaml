$kind: http-request
url: "{{baseUrl}}/api/patients"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "full_name": "",
      "email": "not-an-email",
      "phone": "12"
    }
scripts:
  - type: afterResponse
    code: pm.test('status is 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 5000
