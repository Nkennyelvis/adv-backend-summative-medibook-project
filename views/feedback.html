<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 750px; margin: 30px auto; padding: 0 15px; color: #222; background: #fafafa; }
    h1 { color: #1a5276; font-size: 24px; }
    .top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .date { color: #555; }
    .question { margin-top: 20px; }
    label { font-weight: bold; display: block; margin-bottom: 6px; }
    textarea { width: 100%; min-height: 90px; padding: 8px; font-size: 14px; box-sizing: border-box; }
    button { margin-top: 20px; padding: 10px 18px; background: #1a5276; color: white; border: none; cursor: pointer; }
    nav a { margin-left: 8px; }
    nav a.active { font-weight: bold; text-decoration: none; color: #222; }
  </style>
</head>
<body>
  <div class="top">
    <p class="date">{{date_label}}: {{today}}</p>
    <nav>{{language_label}}: {{lang_links}}</nav>
  </div>

  <h1>{{title}}</h1>
  <p>{{instructions}}</p>

  <form onsubmit="event.preventDefault(); alert('Thank you!');">
    {{questions}}
    <button type="submit">{{submit}}</button>
  </form>
</body>
</html>
